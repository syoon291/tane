<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- No third-party code: scripts only from this site, network only to this site and the GitHub API (tane-data). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; connect-src 'self' https://api.github.com; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>tane</title>
  <meta name="description" content="Explore the ideas from your saved videos, from big areas down to single ideas, and how they connect.">
  <meta name="theme-color" content="#f5f2ea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14130f" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="tane">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="#explore"><svg class="mark" viewBox="0 0 512 512" aria-hidden="true"><ellipse cx="236" cy="320" rx="88" ry="118" transform="rotate(28 236 320)"/><path d="M296 190 A86 86 0 0 1 400 104 A86 86 0 0 1 296 190 Z"/><path class="stem" d="M291 226 L297 188"/></svg>tane</a>
    <button id="data-btn" class="icon-btn" type="button" aria-label="Data and backup" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3"/></svg>
    </button>
  </header>
  <div id="demo-bar" class="demo-bar" role="note" hidden>
    <span><b>Demo library</b> · made-up ideas, not yours</span>
    <a href="./#explore">Leave demo</a>
  </div>

  <!-- One view at a time; tabs (Today, Mine) join Explore in later phases (router.js TABS). -->
  <main id="view" tabindex="-1"></main>
  <div id="announcer" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></div>

  <dialog id="data-dialog" aria-labelledby="data-title">
    <div class="sheet" id="data-sheet"></div>
  </dialog>

  <input id="import-file" type="file" accept="application/json,.json" hidden>
  <noscript><p class="wrap">tane needs JavaScript turned on.</p></noscript>
  <script src="app.js" type="module"></script>
</body>
</html>
